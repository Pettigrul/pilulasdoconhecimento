<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pílulas do Conhecimento</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fundo); color:var(--texto); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .faixa { position:absolute; top:0; left:0; width:960px; height:112px; }
  .faixa svg { display:block; width:960px; height:112px; }
  .nucleo { fill:var(--azul-nucleo); }
  .capsula { fill:var(--azul-capsula); }
  .eletrico { fill:var(--azul-eletrico); }
  .claro { fill:var(--destaque); }
  .azul { fill:var(--azul-eletrico); }
  .branca { fill:var(--branco-gelo); }
  .blk { rx:var(--raio-cartao); }
  .pil { rx:8px; }
  .words { position:absolute; left:var(--espaco-6); right:var(--espaco-6); bottom:var(--espaco-6); }
  .name { margin:0; font-size:60px; line-height:.95; font-weight:800; letter-spacing:-.01em; color:var(--texto); white-space:nowrap; }
  .tag { margin:var(--espaco-1) 0 0 3px; font-size:14px; line-height:20px; color:var(--texto-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="faixa" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocos     azul-nucleo 420 (o centro de luz da vinheta, o maior) · azul-capsula 192 · azul-eletrico 128 · destaque (azul claro no palco, azul-capsula no papel) sangrando pela direita; faixa de 112px no topo, ~39% da capa
  arranjo    faixa de blocos desiguais em linha, sangrando pelo topo com cantos raio-cartao embaixo, gutters espaco-2; o nome é largo demais para a zona de 440px, então vai por baixo
  padrão     pílulas metade azul-eletrico, metade branco-gelo, escolhidas porque a cápsula dividida é o elemento central da marca (README: "Metade azul, metade branca"); 17 cápsulas a passo espaco-6 caindo sobre os blocos como o chão da vinheta
  escalas    passo espaco-6 (48); gutter espaco-2 (16); cantos raio-cartao (24); cápsula 48x16, rx metade da altura (raio-capsula)
-->
